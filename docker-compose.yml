services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=dev-secret-change-in-production
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    develop:
      watch:
        - path: ./src
          action: rebuild
        - path: ./package.json
          action: rebuild

